[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biblical-linguistics-mcp"
version = "0.1.0"
description = "Biblical Linguistic Research Agent — MCP server for Hebrew & Greek word study, morphological parsing, cross-references, and LXX alignment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1,<2",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
biblical-linguistics-mcp = "biblical_linguistics_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biblical_linguistics_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
